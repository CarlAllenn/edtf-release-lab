---
name: Agent leak test

# Hypothesis (2026-08-08 StepSecurity incident): with its control plane
# returning 404s, harden-runner's agent buffers egress telemetry in RAM
# instead of flushing — memory growth proportional to network volume,
# which is exactly the profile of the three publish-job OOM deaths. This
# moves real bytes through the agent and samples its RSS as it goes.
"on":
  workflow_dispatch: {}

# Nothing at workflow level; each job grants only what it needs.
permissions: {}

# One repro at a time: these are diagnostic runs whose whole value is a
# clean signal, and two overlapping runs contend for the same runner
# conditions they exist to measure.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  leak:
    name: Bulk egress with agent RSS sampled
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Read-only: a diagnostic run reads the tree and writes nothing back.
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            static.crates.io:443
            crates.io:443
            index.crates.io:443
      - name: Pull bulk data through the agent, sampling its RSS
        run: |
          set -euo pipefail
          agent_rss() {
            ps -o rss= -C agent 2>/dev/null | awk '{s+=$1} END {print int(s/1024)"MB"}'
          }
          echo "agent RSS at start: $(agent_rss)"
          # ~50 x ~10MB crate downloads = ~500MB through the agent, plus
          # hundreds of API connections.
          for round in $(seq 1 10); do
            for i in $(seq 1 5); do
              curl -so /dev/null --max-time 60 \
                "https://static.crates.io/crates/windows/windows-0.52.0.crate" || true
            done
            for i in $(seq 1 50); do
              curl -so /dev/null --max-time 10 "https://crates.io/api/v1/crates/edtf-core" || true
            done
            echo "after round ${round} (~$((round * 50))MB + $((round * 50)) connections): agent RSS $(agent_rss)"
            free -m | head -2 | tail -1
          done
