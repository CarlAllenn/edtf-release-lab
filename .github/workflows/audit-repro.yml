# Weekly reproducibility audit: rebuild the latest release with the real
# class workflow and prove the published bytes, via the shared org
# workflow. Failure files an issue.
name: audit-repro

on:
  schedule:
    # Thursdays 06:00 UTC — its own day, after audit (Mon) and scorecard
    # (Tue), so one failure never masks another.
    - cron: "0 6 * * 4"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  repro-extension:
    uses: monumental-archive/.github/.github/workflows/repro-check.yml@a567e3c97791dc623b5303e3d97ff75e390ee74a # v1.19.0
    with:
      class: pgrx-extension
      extension-crate-dir: crates/lab-pg
    permissions:
      contents: read # read the release, check out the tag
      issues: write # a broken reproducibility claim must page

  repro:
    uses: monumental-archive/.github/.github/workflows/repro-check.yml@a567e3c97791dc623b5303e3d97ff75e390ee74a # v1.19.0
    with:
      class: rust-binary
      exclude: lab-pg
    permissions:
      contents: read # read the release, check out the tag
      issues: write # a broken reproducibility claim must page
