---
name: Audit vs block (empty CARGO_HOME)

# One question: is harden-runner's egress ENFORCEMENT a precondition for the
# empty-CARGO_HOME stall, or does the stall happen regardless?
#
# rustup-repro answered everything except this. Its legs A and C (block)
# stalled and their bounds fired cleanly at 3m01s; leg D (audit) blew past
# 540s of internal bounds AND its 15-minute job timeout, and had to be
# cancelled at 20 minutes — which lost its log and left the question open.
#
# So this run is built to be cheap to lose:
#   - one probe, not four, and only the call that actually stalls
#   - 45s bound with --kill-after, so SIGKILL follows if SIGTERM is ignored
#   - timeout-minutes: 5, so a wedged runner costs five minutes, not twenty
#
# Both legs are identical except egress-policy. LAB DIVERGENCE: nothing is
# published and no release is touched.
"on":
  workflow_dispatch: {}

permissions: {}

jobs:
  block:
    name: block + empty CARGO_HOME
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            codeload.github.com:443
            crates.io:443
            index.crates.io:443
            static.crates.io:443
            static.rust-lang.org:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
            nodejs.org:443
            registry.npmjs.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        env:
          MISE_CONFIG_FILE: ${{ github.workspace }}/rustup-repro/mise.toml
        with:
          version: 2026.7.18
          cache: false
      - name: cargo new under an empty CARGO_HOME
        env:
          MISE_CONFIG_FILE: ${{ github.workspace }}/rustup-repro/mise.toml
        run: |
          set -uo pipefail
          echo "[$(date -u +%H:%M:%S)Z] cargo   : $(command -v cargo)"
          echo "[$(date -u +%H:%M:%S)Z] RUSTUP_TOOLCHAIN=${RUSTUP_TOOLCHAIN:-unset}"
          scratch=$(mktemp -d)
          export CARGO_HOME="${scratch}/cargo"
          echo "[$(date -u +%H:%M:%S)Z] CARGO_HOME=${CARGO_HOME} (empty)"
          echo "[$(date -u +%H:%M:%S)Z] >>> cargo new"
          rc=0
          timeout --kill-after=15s 45s cargo new --lib "${scratch}/probe" || rc=$?
          echo "[$(date -u +%H:%M:%S)Z] <<< rc=${rc}  (124=SIGTERM bound, 137=SIGKILL)"
          exit "${rc}"

  audit:
    name: audit + empty CARGO_HOME
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        env:
          MISE_CONFIG_FILE: ${{ github.workspace }}/rustup-repro/mise.toml
        with:
          version: 2026.7.18
          cache: false
      - name: cargo new under an empty CARGO_HOME
        env:
          MISE_CONFIG_FILE: ${{ github.workspace }}/rustup-repro/mise.toml
        run: |
          set -uo pipefail
          echo "[$(date -u +%H:%M:%S)Z] cargo   : $(command -v cargo)"
          echo "[$(date -u +%H:%M:%S)Z] RUSTUP_TOOLCHAIN=${RUSTUP_TOOLCHAIN:-unset}"
          scratch=$(mktemp -d)
          export CARGO_HOME="${scratch}/cargo"
          echo "[$(date -u +%H:%M:%S)Z] CARGO_HOME=${CARGO_HOME} (empty)"
          echo "[$(date -u +%H:%M:%S)Z] >>> cargo new"
          rc=0
          timeout --kill-after=15s 45s cargo new --lib "${scratch}/probe" || rc=$?
          echo "[$(date -u +%H:%M:%S)Z] <<< rc=${rc}  (124=SIGTERM bound, 137=SIGKILL)"
          exit "${rc}"
