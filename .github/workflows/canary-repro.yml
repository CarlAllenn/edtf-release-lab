---
name: Canary repro

# Diagnose the v1.2.0 canary hang: canary.sh's cargo probes complete in
# ~11s on a developer machine but hang silently for 28-40 minutes on the
# hosted runner inside edtf's publish job. Two identical probe jobs, one
# variable: harden-runner egress enforcement (same pin, same allowlist as
# the production publish job). A third leg adds the mise-pinned toolchain
# in case the interaction needs the exact cargo build.
"on":
  workflow_dispatch: {}

# Nothing at workflow level; each job grants only what it needs.
permissions: {}

# One repro at a time: these are diagnostic runs whose whole value is a
# clean signal, and two overlapping runs contend for the same runner
# conditions they exist to measure.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  hardened:
    name: Probe with harden-runner block
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # Read-only: a diagnostic run reads the tree and writes nothing back.
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          # The production publish job's list, verbatim.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            uploads.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            codeload.github.com:443
            crates.io:443
            index.crates.io:443
            static.crates.io:443
            static.rust-lang.org:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            search.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443
            tmaproduction.blob.core.windows.net:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
      - name: Run the canary probes with heartbeats
        run: |
          set -euo pipefail
          export CARGO_HOME="${RUNNER_TEMP}/cargo"
          echo "[$(date -u +%H:%M:%S)] cargo $(cargo --version 2>/dev/null || echo unknown)"
          cd "${RUNNER_TEMP}"
          cargo new --lib probe > /dev/null
          cd probe
          echo "[$(date -u +%H:%M:%S)] cargo add edtf-core"
          timeout 300 cargo add edtf-core@=1.2.0
          echo "[$(date -u +%H:%M:%S)] cargo add edtf-calendars"
          timeout 300 cargo add edtf-calendars@=1.2.0
          echo "[$(date -u +%H:%M:%S)] cargo add edtf-normalize"
          timeout 300 cargo add edtf-normalize@=1.2.0
          echo "[$(date -u +%H:%M:%S)] cargo build"
          timeout 600 cargo build --quiet
          echo "[$(date -u +%H:%M:%S)] cargo install edtf-cli"
          timeout 600 cargo install edtf-cli@1.2.0 --root "${RUNNER_TEMP}/cli" --quiet
          echo "[$(date -u +%H:%M:%S)] npm pack edtf-wasm"
          timeout 300 npm pack edtf-wasm@1.2.0 --pack-destination "${RUNNER_TEMP}"
          echo "[$(date -u +%H:%M:%S)] ALL PROBES PASSED"

  control:
    name: Probe without harden-runner
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # Read-only: a diagnostic run reads the tree and writes nothing back.
    permissions:
      contents: read
    steps:
      - name: Run the canary probes with heartbeats
        run: |
          set -euo pipefail
          export CARGO_HOME="${RUNNER_TEMP}/cargo"
          echo "[$(date -u +%H:%M:%S)] cargo $(cargo --version 2>/dev/null || echo unknown)"
          cd "${RUNNER_TEMP}"
          cargo new --lib probe > /dev/null
          cd probe
          echo "[$(date -u +%H:%M:%S)] cargo add edtf-core"
          timeout 300 cargo add edtf-core@=1.2.0
          echo "[$(date -u +%H:%M:%S)] cargo add edtf-calendars"
          timeout 300 cargo add edtf-calendars@=1.2.0
          echo "[$(date -u +%H:%M:%S)] cargo add edtf-normalize"
          timeout 300 cargo add edtf-normalize@=1.2.0
          echo "[$(date -u +%H:%M:%S)] cargo build"
          timeout 600 cargo build --quiet
          echo "[$(date -u +%H:%M:%S)] cargo install edtf-cli"
          timeout 600 cargo install edtf-cli@1.2.0 --root "${RUNNER_TEMP}/cli" --quiet
          echo "[$(date -u +%H:%M:%S)] npm pack edtf-wasm"
          timeout 300 npm pack edtf-wasm@1.2.0 --pack-destination "${RUNNER_TEMP}"
          echo "[$(date -u +%H:%M:%S)] ALL PROBES PASSED"

  # --- mise A/B (added 2026-08-08, incident #132) ----------------------
  #
  # The legs above hold the toolchain constant (runner-image cargo) and
  # vary egress enforcement; both are green, which exonerates block mode.
  # These legs invert that: egress enforcement is held at block with the
  # production allowlist, and the ONLY variable is the mise version that
  # provides `cargo`.
  #
  # Why this is the remaining suspect: between v1.1.2 (canary green, 5s)
  # and v1.2.0 (canary hung 45m) the canary's entire execution path is
  # byte-identical — canary.sh, the harden-runner pin, the 24-domain
  # allowlist, the mise-action pin, and install_args — except that mise
  # moved 2026.7.12 -> 2026.7.18.
  #
  # LAB DIVERGENCE: no mise.toml here, so tool versions are passed
  # explicitly rather than read from a pinned config with a lockfile.
  # A hang reproduces root cause; a clean run narrows but does not
  # exonerate, because the production settings block (locked,
  # locked_verify_provenance, minimum_release_age) is not modelled.

  mise-712-block:
    name: mise 2026.7.12 + harden-runner block
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Read-only: a diagnostic run reads the tree and writes nothing back.
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            uploads.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            codeload.github.com:443
            crates.io:443
            index.crates.io:443
            static.crates.io:443
            static.rust-lang.org:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.12
          install_args: rust@1.97.1 node@26.5.1
          cache: false
      - name: Run the canary probes with heartbeats
        run: |
          set -euo pipefail
          export CARGO_HOME="${RUNNER_TEMP}/cargo"
          echo "[$(date -u +%H:%M:%S)] mise $(mise --version 2>/dev/null || echo unknown)"
          echo "[$(date -u +%H:%M:%S)] which cargo: $(command -v cargo)"
          echo "[$(date -u +%H:%M:%S)] RUSTUP_TOOLCHAIN=${RUSTUP_TOOLCHAIN:-unset} RUSTUP_HOME=${RUSTUP_HOME:-unset}"
          cd "${RUNNER_TEMP}"
          echo "[$(date -u +%H:%M:%S)] cargo new (production's first, unbounded call)"
          timeout 300 cargo new --lib probe > /dev/null
          cd probe
          echo "[$(date -u +%H:%M:%S)] cargo add edtf-core"
          timeout 300 cargo add edtf-core@=1.2.0
          echo "[$(date -u +%H:%M:%S)] cargo add edtf-calendars"
          timeout 300 cargo add edtf-calendars@=1.2.0
          echo "[$(date -u +%H:%M:%S)] cargo add edtf-normalize"
          timeout 300 cargo add edtf-normalize@=1.2.0
          echo "[$(date -u +%H:%M:%S)] cargo build"
          timeout 600 cargo build --quiet
          echo "[$(date -u +%H:%M:%S)] cargo install edtf-cli"
          timeout 600 cargo install edtf-cli@1.2.0 --root "${RUNNER_TEMP}/cli" --quiet
          echo "[$(date -u +%H:%M:%S)] npm pack edtf-wasm"
          timeout 300 npm pack edtf-wasm@1.2.0 --pack-destination "${RUNNER_TEMP}"
          echo "[$(date -u +%H:%M:%S)] ALL PROBES PASSED"

  mise-718-block:
    name: mise 2026.7.18 + harden-runner block
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Read-only: a diagnostic run reads the tree and writes nothing back.
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            uploads.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            codeload.github.com:443
            crates.io:443
            index.crates.io:443
            static.crates.io:443
            static.rust-lang.org:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.18
          install_args: rust@1.97.1 node@26.5.1
          cache: false
      - name: Run the canary probes with heartbeats
        run: |
          set -euo pipefail
          export CARGO_HOME="${RUNNER_TEMP}/cargo"
          echo "[$(date -u +%H:%M:%S)] mise $(mise --version 2>/dev/null || echo unknown)"
          echo "[$(date -u +%H:%M:%S)] which cargo: $(command -v cargo)"
          echo "[$(date -u +%H:%M:%S)] RUSTUP_TOOLCHAIN=${RUSTUP_TOOLCHAIN:-unset} RUSTUP_HOME=${RUSTUP_HOME:-unset}"
          cd "${RUNNER_TEMP}"
          echo "[$(date -u +%H:%M:%S)] cargo new (production's first, unbounded call)"
          timeout 300 cargo new --lib probe > /dev/null
          cd probe
          echo "[$(date -u +%H:%M:%S)] cargo add edtf-core"
          timeout 300 cargo add edtf-core@=1.2.0
          echo "[$(date -u +%H:%M:%S)] cargo add edtf-calendars"
          timeout 300 cargo add edtf-calendars@=1.2.0
          echo "[$(date -u +%H:%M:%S)] cargo add edtf-normalize"
          timeout 300 cargo add edtf-normalize@=1.2.0
          echo "[$(date -u +%H:%M:%S)] cargo build"
          timeout 600 cargo build --quiet
          echo "[$(date -u +%H:%M:%S)] cargo install edtf-cli"
          timeout 600 cargo install edtf-cli@1.2.0 --root "${RUNNER_TEMP}/cli" --quiet
          echo "[$(date -u +%H:%M:%S)] npm pack edtf-wasm"
          timeout 300 npm pack edtf-wasm@1.2.0 --pack-destination "${RUNNER_TEMP}"
          echo "[$(date -u +%H:%M:%S)] ALL PROBES PASSED"

  mise-718-nohr:
    name: mise 2026.7.18 without harden-runner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Read-only: a diagnostic run reads the tree and writes nothing back.
    permissions:
      contents: read
    steps:
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.18
          install_args: rust@1.97.1 node@26.5.1
          cache: false
      - name: Run the canary probes with heartbeats
        run: |
          set -euo pipefail
          export CARGO_HOME="${RUNNER_TEMP}/cargo"
          echo "[$(date -u +%H:%M:%S)] mise $(mise --version 2>/dev/null || echo unknown)"
          echo "[$(date -u +%H:%M:%S)] which cargo: $(command -v cargo)"
          echo "[$(date -u +%H:%M:%S)] RUSTUP_TOOLCHAIN=${RUSTUP_TOOLCHAIN:-unset} RUSTUP_HOME=${RUSTUP_HOME:-unset}"
          cd "${RUNNER_TEMP}"
          echo "[$(date -u +%H:%M:%S)] cargo new (production's first, unbounded call)"
          timeout 300 cargo new --lib probe > /dev/null
          cd probe
          echo "[$(date -u +%H:%M:%S)] cargo add edtf-core"
          timeout 300 cargo add edtf-core@=1.2.0
          echo "[$(date -u +%H:%M:%S)] cargo add edtf-calendars"
          timeout 300 cargo add edtf-calendars@=1.2.0
          echo "[$(date -u +%H:%M:%S)] cargo add edtf-normalize"
          timeout 300 cargo add edtf-normalize@=1.2.0
          echo "[$(date -u +%H:%M:%S)] cargo build"
          timeout 600 cargo build --quiet
          echo "[$(date -u +%H:%M:%S)] cargo install edtf-cli"
          timeout 600 cargo install edtf-cli@1.2.0 --root "${RUNNER_TEMP}/cli" --quiet
          echo "[$(date -u +%H:%M:%S)] npm pack edtf-wasm"
          timeout 300 npm pack edtf-wasm@1.2.0 --pack-destination "${RUNNER_TEMP}"
          echo "[$(date -u +%H:%M:%S)] ALL PROBES PASSED"
