# The continuous archetype: digest publish on merge, weekly rebuild, no
# tags, no versions. In the LAB this coexists with the versioned caller
# deliberately: the same repository proves both archetypes, and the
# continuous guard refusing tags while publish.yml refuses branches is
# the pair of inverse guards doing their jobs.
name: continuous

on:
  push:
    branches: [main]
  schedule:
    # Wednesdays 06:00 UTC — the weekly remediation rebuild, refreshing
    # every base layer nothing can pin.
    - cron: "0 6 * * 3"
  workflow_dispatch:

permissions: {}

# Never two publishes racing; a fresher merge supersedes a queued rebuild.
concurrency:
  group: continuous-publish
  cancel-in-progress: false

jobs:
  publish:
    uses: monumental-archive/.github/.github/workflows/continuous.yml@0b961790f284095e61df92d912b46776d0cd97a4 # main 2026-08-10
    with:
      smoke-test: scripts/image-smoke.sh
    permissions:
      contents: read # build checks out this repository
      packages: write # push per-arch images and the manifest list
      id-token: write # the signer mints the Sigstore identity
      attestations: write # the signer persists the provenance
      artifact-metadata: write # the signer creates the storage record
