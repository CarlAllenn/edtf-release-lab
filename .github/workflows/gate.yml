# The org gate. This stub is a repo's entire CI obligation: everything else
# (linters, versions, enforcement) arrives via the shared workflow and the
# toolbelt it pins. Update the SHA when moving to a newer gate; once the
# .github repo cuts releases, Renovate manages this pin like any other.
name: gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    permissions:
      # Stated, not inherited: a uses: job takes the workflow-level
      # default, so a shared workflow that gains a permission breaks
      # every silent caller as startup_failure with no log.
      contents: read # the gate checks out this repo and the toolbelt
    uses: monumental-archive/.github/.github/workflows/ci.yml@14da382cd543141d632b2210a485fbe47455ce68 # v1.20.0
    secrets:
      # The badge feed, never the gate: absent, the upload job skips
      # clean. Token stays REQUIRED on the Codecov side — tokenless
      # ingest accepts forged reports from anyone (.github#316).
      codecov-token: ${{ secrets.CODECOV_TOKEN }}
