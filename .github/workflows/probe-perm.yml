# EXPERIMENT: is artifact-metadata a permission key the parser accepts?
name: probe-perm

on:
  push:
    branches: [exercise/sign]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write # the key under test
    steps:
      - run: echo "artifact-metadata accepted by the parser"
