---
name: Release lab

# The test bed for the edtf release pipeline's RELEASE HALF (the half the
# production runbook says is covered by nothing): tag creation, draft
# assembly, asset upload, immutability, publish, and every recovery path —
# against real GitHub APIs, with stub artifacts and NO registry publishes.
#
# Scenarios (see README):
#   phase1                     — tag-release.sh cuts per-crate tags + drafts
#   phase2                     — stubs -> SHA256SUMS -> attach -> publish
#   phase2 + kill_after        — die at a chosen point, then re-dispatch
#                                phase2 and prove convergence
"on":
  workflow_dispatch:
    inputs:
      mode:
        description: Which phase to run
        type: choice
        options: [phase1, phase2]
        default: phase2
      kill_after:
        description: Simulate a runner death after this step (phase2 only)
        type: choice
        options: [none, build, attach]
        default: none

permissions: {}

concurrency:
  group: release-lab
  cancel-in-progress: false

jobs:
  phase1:
    name: Phase 1 — tags and draft releases
    if: inputs.mode == 'phase1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Create per-crate tags and draft releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/tag-release.sh

  phase2:
    name: Phase 2a — assemble the attested state
    if: inputs.mode == 'phase2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Resolve version
        run: |
          set -euo pipefail
          version=$(cargo pkgid --manifest-path crates/lab-core/Cargo.toml | sed 's/.*[@#]//')
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Build stub artifacts
        run: .github/scripts/build-stub-artifacts.sh

      - name: Checksum the artifacts
        run: .github/scripts/checksum-artifacts.sh

      - name: Manifest the attested state
        run: |
          set -euo pipefail
          # The transport-integrity manifest for the job hand-off: the
          # finish job recomputes it before touching anything public.
          (cd dist && sha256sum -- * | sort -k2 > ../ATTESTED-STATE.sha256)
          cat ATTESTED-STATE.sha256

      - name: Simulated runner death (after build)
        if: inputs.kill_after == 'build'
        run: |
          echo "::error::simulated death after build — re-run failed jobs to test resume"
          exit 1

      - name: Upload the attested state
        uses: actions/upload-artifact@v6
        with:
          name: attested-state
          path: |
            dist/
            ATTESTED-STATE.sha256
          if-no-files-found: error
          retention-days: 7

  finish:
    name: Phase 2b — canary, attach, publish (fresh runner)
    if: inputs.mode == 'phase2'
    needs: phase2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Resolve version
        run: |
          set -euo pipefail
          version=$(cargo pkgid --manifest-path crates/lab-core/Cargo.toml | sed 's/.*[@#]//')
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Download the attested state
        uses: actions/download-artifact@v6
        with:
          name: attested-state

      - name: Verify the attested state survived transport
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check --strict --quiet ../ATTESTED-STATE.sha256)
          echo "::notice::attested state verified across the job boundary"

      - name: Simulated runner death (after attach)
        if: inputs.kill_after == 'attach'
        run: |
          echo "::error::simulated death before attach — re-run failed jobs to test resume"
          exit 1

      - name: Attach the artifacts to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/upload-lab-assets.sh

      - name: Publish the per-crate releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/publish-releases.sh
