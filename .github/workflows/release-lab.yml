---
name: Release lab

# The test bed for the edtf release pipeline's RELEASE HALF (the half the
# production runbook says is covered by nothing): tag creation, draft
# assembly, asset upload, immutability, publish, and every recovery path —
# against real GitHub APIs, with stub artifacts and NO registry publishes.
#
# Scenarios (see README):
#   phase1                     — tag-release.sh cuts per-crate tags + drafts
#   phase2                     — stubs -> SHA256SUMS -> SIGN -> VERIFY ->
#                                attach -> publish
#   phase2 + kill_after        — die at a chosen point, then re-dispatch
#                                phase2 and prove convergence
#   oci                        — build a throwaway image, sign it through
#                                attest-oci.yml, verify it through
#                                verify-oci.yml
#
# phase2 also exercises the SLSA v1.0 Build L3 boundary (edtf#116): signing
# happens in monumental-archive/trusted-builder, pinned by commit SHA, which receives
# nothing from this repository except a file of digests. This is the first
# place that split runs at all — production adopts it only once it is green
# here, including the resume paths.
"on":
  workflow_dispatch:
    inputs:
      mode:
        description: Which phase to run
        type: choice
        options: [phase1, phase2, oci]
        default: phase2
      kill_after:
        description: Simulate a runner death after this step (phase2 only)
        type: choice
        options: [none, build, attach]
        default: none

permissions: {}

concurrency:
  group: release-lab
  cancel-in-progress: false

jobs:
  phase1:
    name: Phase 1 — tags and draft releases
    if: inputs.mode == 'phase1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # cut tags, drafts and the final publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Create per-crate tags and draft releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/tag-release.sh

  phase2:
    name: Phase 2a — assemble the attested state
    if: inputs.mode == 'phase2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # read the tree; nothing is written back
    outputs:
      subjects-digest: ${{ steps.subjects.outputs.digest }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          version=$(cargo pkgid --manifest-path crates/lab-core/Cargo.toml | sed 's/.*[@#]//')
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build stub artifacts
        run: .github/scripts/build-stub-artifacts.sh

      - name: Checksum the artifacts
        run: .github/scripts/checksum-artifacts.sh

      - name: Manifest the attested state
        run: |
          set -euo pipefail
          # The transport-integrity manifest for the job hand-off: the
          # finish job recomputes it before touching anything public.
          (cd dist && sha256sum -- * | sort -k2 > ../ATTESTED-STATE.sha256)
          cat ATTESTED-STATE.sha256

      # What the trusted builder receives — and the ONLY thing it receives.
      # A copy of the transport manifest, uploaded as its own small artifact
      # so the signing job never has the artifact bytes in its workspace at
      # all. Its digest travels as a declared input, because the artifact
      # store is transport, not a trust boundary.
      - name: Declare the subjects for the trusted builder
        id: subjects
        run: |
          set -euo pipefail
          cp ATTESTED-STATE.sha256 SUBJECTS.sha256
          digest=$(sha256sum SUBJECTS.sha256 | cut -d' ' -f1)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "::notice::$(grep -c . SUBJECTS.sha256) subjects, manifest ${digest}"

      - name: Simulated runner death (after build)
        if: inputs.kill_after == 'build'
        run: |
          echo "::error::simulated death after build — re-run failed jobs to test resume"
          exit 1

      - name: Upload the subjects
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: subjects
          path: SUBJECTS.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Upload the attested state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attested-state
          path: |
            dist/
            ATTESTED-STATE.sha256
          if-no-files-found: error
          retention-days: 7

  # --- the SLSA Build L3 boundary --------------------------------------
  # Signing happens in a workflow this repository cannot modify, over digests
  # this repository computed. Note what is NOT granted to phase2 above:
  # `id-token` and `attestations` live only here, and this job runs no code
  # from this repository.
  #
  # Pinned by commit SHA, not a tag: `uses:` accepts no contexts or
  # expressions, and a mutable ref would put the signer's contents outside
  # the caller's control between runs.
  attest:
    name: Sign — trusted builder
    if: inputs.mode == 'phase2'
    needs: phase2
    permissions:
      # Granted HERE because a called workflow can only downgrade
      # permissions, never elevate them.
      id-token: write # Sigstore signing, in a builder that runs no code of ours
      attestations: write # write the attestation this run produces
      contents: read # read the tree; nothing is written back
    uses: monumental-archive/trusted-builder/.github/workflows/attest.yml@69df1ab9b60a9104426acc10f583138c429cae12
    with:
      subjects-artifact: subjects
      subjects-file: SUBJECTS.sha256
      subjects-digest: ${{ needs.phase2.outputs.subjects-digest }}

  # The stranger's check, before anything is published. Pins the signer to
  # the builder's WORKFLOW FILE and COMMIT — never --signer-repo, which would
  # accept a signature from any workflow in the builder repository.
  verify:
    name: Verify — as a consumer
    if: inputs.mode == 'phase2'
    needs: [phase2, attest]
    permissions:
      # Exactly what verify.yml declares. A called workflow may only
      # downgrade the caller's grant, so a mismatch in the other direction
      # kills the run at startup with nothing to read.
      contents: read # read the tree; nothing is written back
    uses: monumental-archive/trusted-builder/.github/workflows/verify.yml@69df1ab9b60a9104426acc10f583138c429cae12
    with:
      artifacts-artifact: attested-state
      artifacts-path: dist
      source-repo: ${{ github.repository }}
      source-ref: ${{ github.ref }}
      source-digest: ${{ github.sha }}
      signer-workflow: monumental-archive/trusted-builder/.github/workflows/attest.yml
      signer-digest: 69df1ab9b60a9104426acc10f583138c429cae12

  # The transport check and the chaos hook stay HERE: they are properties of
  # this pipeline's job hand-off, not of the shared release half.
  transport:
    name: Phase 2b — verify the attested state across the boundary
    if: inputs.mode == 'phase2'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # read the tree; nothing is written back
    steps:
      - name: Download the attested state
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: attested-state

      - name: Verify the attested state survived transport
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check --strict --quiet ../ATTESTED-STATE.sha256)
          echo "::notice::attested state verified across the job boundary"

      - name: Simulated runner death (after attach)
        if: inputs.kill_after == 'attach'
        run: |
          echo "::error::simulated death before attach — re-run failed jobs to test resume"
          exit 1

  # --- the shared release half -----------------------------------------
  # Both come from trusted-builder, and NEITHER may hold id-token: they run
  # with contents: write against this repository's releases, so a signature
  # minted in one would bear the builder's identity while executing caller
  # code. That is why consumers pin --signer-workflow to attest.yml alone and
  # never --signer-repo.
  #
  # The manifest is ENUMERATED, and the count is asserted on the other side:
  # a glob is what silently skipped a crate at edtf v1.0.0.
  attach:
    name: Attach assets — shared
    if: inputs.mode == 'phase2'
    needs: [phase2, transport]
    permissions:
      contents: write # cut tags, drafts and the final publish
    uses: monumental-archive/trusted-builder/.github/workflows/attach-assets.yml@69df1ab9b60a9104426acc10f583138c429cae12
    with:
      artifacts-artifact: attested-state
      artifacts-path: dist
      # replace-while-draft, not skip-if-present: build-stub-artifacts.sh
      # embeds a BUILT_AT timestamp precisely so rebuilt bytes differ, which
      # is the condition that makes name-skipping publish run 1's tarballs
      # beside run 2's SHA256SUMS.
      policy: replace-while-draft
      expected-count: 3
      manifest: |
        lab-cli-v${{ needs.phase2.outputs.version }} lab-cli-${{ needs.phase2.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz
        lab-cli-v${{ needs.phase2.outputs.version }} lab-cli-${{ needs.phase2.outputs.version }}-aarch64-unknown-linux-gnu.tar.gz
        lab-cli-v${{ needs.phase2.outputs.version }} SHA256SUMS

  publish:
    name: Publish releases — shared
    if: inputs.mode == 'phase2'
    needs: [phase2, attach]
    permissions:
      contents: write # cut tags, drafts and the final publish
    uses: monumental-archive/trusted-builder/.github/workflows/publish-releases.yml@69df1ab9b60a9104426acc10f583138c429cae12
    with:
      expected-count: 2
      releases: |
        lab-core-v${{ needs.phase2.outputs.version }}
        lab-cli-v${{ needs.phase2.outputs.version }}

  # --- the image path -------------------------------------------------
  # Nothing else in this repository publishes an image, so attest-oci.yml and
  # verify-oci.yml had no subject to work on. This scenario manufactures one:
  # a `scratch` image, which needs no base pull, so the test exercises the
  # signing path rather than a build toolchain.
  oci-build:
    name: OCI — build and push by digest
    if: inputs.mode == 'oci'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # read the tree; nothing is written back
      packages: write # push the throwaway image
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        env:
          IMAGE: ghcr.io/monumental-archive/edtf-release-lab
        run: |
          set -euo pipefail
          docker build -f docker/lab-image.Dockerfile -t "${IMAGE}:lab" .
          docker push "${IMAGE}:lab"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:lab" | cut -d@ -f2)
          if [[ ! ${digest} =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::could not resolve a digest for ${IMAGE}:lab"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "::notice::pushed ${IMAGE}@${digest}"

  # Four scopes, all of them declared by the callee — packages: write included,
  # because push-to-registry writes the attestation into the registry and a
  # called workflow only gets the scopes it declares.
  oci-attest:
    name: OCI — sign via the trusted builder
    if: inputs.mode == 'oci'
    needs: oci-build
    permissions:
      id-token: write # Sigstore signing, in a builder that runs no code of ours
      attestations: write # write the attestation this run produces
      contents: read # read the tree; nothing is written back
      packages: write # push the image being attested
    uses: monumental-archive/trusted-builder/.github/workflows/attest-oci.yml@c9b12b141e0d3a887bd57080b5c6ad6682b8b89c
    with:
      subject-name: ghcr.io/monumental-archive/edtf-release-lab
      subject-digest: ${{ needs.oci-build.outputs.digest }}
      # On, so the attestation lands in the registry as a referrer — the route
      # that survives a repository transfer, where the API lookup does not.
      push-to-registry: true

  oci-verify:
    name: OCI — verify as a consumer
    if: inputs.mode == 'oci'
    needs: [oci-build, oci-attest]
    permissions:
      contents: read # read the tree; nothing is written back
      packages: read # pull the published image back to verify it
    uses: monumental-archive/trusted-builder/.github/workflows/verify-oci.yml@c9b12b141e0d3a887bd57080b5c6ad6682b8b89c
    with:
      image: ghcr.io/monumental-archive/edtf-release-lab
      digest: ${{ needs.oci-build.outputs.digest }}
      source-repo: ${{ github.repository }}
      source-ref: ${{ github.ref }}
      source-digest: ${{ github.sha }}
      signer-workflow: monumental-archive/trusted-builder/.github/workflows/attest-oci.yml
      signer-digest: c9b12b141e0d3a887bd57080b5c6ad6682b8b89c
      # Read the attestation from the registry rather than the API, which is
      # the path an ownership change cannot break.
      bundle-from-oci: true
