# Release phase 1. This stub is a versioned repo's entire release-PR
# obligation: version decision, changelog, Release PR, and — on merge —
# the App-minted v* tag and draft release, all via the shared workflow.
# Phase 2 (this repository's own publish workflow, triggered by the tag)
# builds, proves and signs. See docs/release.md in monumental-archive/.github.
name: release

on:
  push:
    branches: [main]
  # Recovery path: re-run the tag step against a release commit whose first
  # attempt failed. The shared workflow refuses anything else.
  workflow_dispatch: {}

permissions: {}

# Never cancel a release mid-flight; queue instead — and the group is the
# WORKFLOW, never the commit: the Release-PR machinery works on two fixed
# branches, so per-commit keying let two merges race and killed one
# mid-script on a 403 (.github#316, measured here 2026-08-13).
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    uses: monumental-archive/.github/.github/workflows/release.yml@f248bbd7b42678c1d1f0c0aa14e76118a850d171 # v1.22.2
    permissions:
      # Required. A uses: job with no permissions block takes the
      # WORKFLOW-level default, not some ambient grant — and the shared
      # workflow needs this for git-cliff's GitHub API calls. Omitting it
      # kills the run as startup_failure with no jobs and no log.
      contents: read # git-cliff's API calls, and the checkout
    secrets:
      app-private-key: ${{ secrets.TAG_MINT_APP_PRIVATE_KEY }}
