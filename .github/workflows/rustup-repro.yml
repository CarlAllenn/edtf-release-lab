---
name: Rustup CARGO_HOME repro

# Isolate the v1.2.2 canary stall (edtf#132). Confirmed from the first
# surviving log: canary.sh emits ZERO bytes and stalls at or before
# `cargo new`, its first cargo invocation.
#
# What production does there, per the publish job's own env block:
#   cargo             -> /home/runner/.cargo/bin/cargo  (rustup PROXY;
#                        ~/.cargo/bin precedes mise's shims on PATH)
#   RUSTUP_HOME       -> /home/runner/.rustup           (left intact)
#   RUSTUP_TOOLCHAIN  -> 1.97.1                         (left intact)
#   CARGO_HOME        -> repointed by canary.sh at an EMPTY scratch dir
#
# canary-repro's legs all left RUSTUP_* unset and all passed, so this
# combination has never been exercised. Four legs, one variable each.
"on":
  workflow_dispatch: {}

permissions: {}

jobs:

  prod-shape:
    name: "A — block + rustup env + empty CARGO_HOME (production)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            uploads.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            codeload.github.com:443
            crates.io:443
            index.crates.io:443
            static.crates.io:443
            static.rust-lang.org:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        env:
          MISE_CONFIG_FILE: ${{ github.workspace }}/rustup-repro/mise.toml
        with:
          version: 2026.7.18
          cache: false
      - name: Probe the production stall point
        env:
          MISE_CONFIG_FILE: ${{ github.workspace }}/rustup-repro/mise.toml
          REPOINT_CARGO_HOME: "yes"
          UNSET_RUSTUP_ENV: "no"
        run: .github/scripts/probe.sh

  no-repoint:
    name: "B — block + rustup env, CARGO_HOME left alone"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            uploads.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            codeload.github.com:443
            crates.io:443
            index.crates.io:443
            static.crates.io:443
            static.rust-lang.org:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        env:
          MISE_CONFIG_FILE: ${{ github.workspace }}/rustup-repro/mise.toml
