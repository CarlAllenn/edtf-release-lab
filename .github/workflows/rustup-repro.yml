      - name: Probe the production stall point
        env:
          MISE_CONFIG_FILE: ${{ github.workspace }}/rustup-repro/mise.toml
          REPOINT_CARGO_HOME: "yes"
          UNSET_RUSTUP_ENV: "no"
        run: .github/scripts/probe.sh
