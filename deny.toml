# Org dependency policy (docs/dependency-track.md in monumental-archive/.github).
# Copied verbatim from scaffold/ like every stub; lint:deny (gate) runs
# bans+licenses+sources over it, audit:deny (Monday cron) runs advisories.
#
# The gate half is deterministic: outcome is a function of Cargo.lock plus
# this file. The advisory half is a moving feed and lives outside the gate.

[graph]
# All targets: the lock is one artifact; policy must not vary by the
# machine that happens to evaluate it.
all-features = true

[licenses]
# Pure allowlist — anything not named here is denied by default (the only
# shape the current config offers; the old copyleft/osi knobs are gone).
# Additions are a canon decision, not a repo edit.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
]

[bans]
# A `*` requirement is an unpinned intention — deny. Duplicate transitive
# versions are a gate failure too (canon #445): the tree is something a
# repo resolves, not something it tolerates, and the org now has no
# deliberately non-maximal dependency setting (docs/dependency-track.md).
wildcards = "deny"
multiple-versions = "deny"

# ONE entry, and the canon's own check is what proved one is enough.
# Every duplicate here — syn 2 vs 3, toml 0.9 vs 1.1, toml_datetime,
# hashbrown, winnow, shlex, wasi — sits on either side of an ecosystem
# major transition that pgrx's BUILD chain (bindgen, cargo_toml) has not
# made while the rest of the workspace has. It is not the pg14..pg18
# support: those are feature flags on one pgrx version, selecting which
# Postgres headers to bind, and the lock holds exactly one pgrx.
#
# This was written as two entries, pgrx and pgrx-tests, on the reasoning
# that lab-pg dev-depends on pgrx-tests directly so it is a sibling
# rather than a child. True of the manifest, irrelevant to the tree:
# pgrx-tests depends on pgrx, so its skip-tree already covers pgrx's
# whole subtree, and `lint:deny` reported the pgrx entry as doing
# nothing the first time it ran. Excluding lab-pg alone makes `cargo deny
# check bans` pass, which is how we know the boundary sits here at all.
# Delete this when pgrx's build chain reaches syn 3 / toml 1 — and the
# gate will say so before anyone thinks to look.
skip-tree = [
  { crate = "pgrx-tests", reason = "the pgrx build and test chain lags an ecosystem major transition (syn 2, toml 0.9, wasi 0.11); upstream's to resolve, and lab-pg is the only member affected" },
]

[sources]
# Where dependencies come from is a gated invariant: crates.io only.
# A git or alternate-registry dependency is a decision for the canon,
# recorded here as an allow entry, never a repo-local default.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
# Defaults are already maximal: every advisory class errors. The only
# exit is a written `ignore` entry — reason required, citing the VEX
# statement in the canon's security/vex/ that records the decision
# (the L2 contract: known, decided, written down).
ignore = [
  { id = "RUSTSEC-2021-0127", reason = "see security/vex/RUSTSEC-2021-0127.openvex.json — serde_cbor unmaintained, pgrx's own dependency, not_affected: vulnerable_code_not_present" },
]
