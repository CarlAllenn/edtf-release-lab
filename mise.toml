# Repo-specific tools and tasks only; the org belt arrives globally.
# ci is assembled by the toolbelt: define test/build/lint:* tasks here
# and they are collected automatically.

[settings]
lockfile = true

[env]
# Workspace members whose tests cannot run on the gate runner; consumed
# by coverage:check, mirroring the test task's --exclude (lab-pg needs
# a live postgres — the pgrx tests run in the class's own containers).
COVERAGE_EXCLUDE = "lab-pg"
# Same member, same reason, for lint:rust: lab-pg is a pgrx extension
# whose features (pg14..pg18) are mutually exclusive, so --all-features
# cannot compile it and it needs a live postgres regardless. Declared
# rather than inherited from default-members, so a reviewer sees it.
CLIPPY_EXCLUDE = "lab-pg"
# Which nightly audit:fuzz runs the sanitized targets under (.github#445).
# AddressSanitizer is cargo-fuzz's default and needs -Zsanitizer, which
# stable refuses; the task selects this by name and never guesses. Dated,
# never bare "nightly" — a moving channel is not a pinned input, and this
# is the one pin in the org Renovate cannot bump.
FUZZ_TOOLCHAIN = "nightly-2026-07-20"
# How long each target fuzzes on the Monday cron. 300 rather than the
# 60s floor: --careful buys extra checks per execution at roughly a
# fifth of the throughput, and on a weekly cron for a public repo the
# minutes are free — so buy the checks and the coverage, not one of them.
FUZZ_SECONDS = "300"
# Hermetic Go, stated where the fixture is built and tested locally: no
# cgo (one compiler, static output) and no toolchain auto-download (the
# pin below is the only toolchain; a disagreeing go.mod directive fails
# loudly instead of fetching another). The go-binary class states the
# same two values at its own jobs — a release leg must never inherit
# hermeticity from a caller — so these serve the gate and keep the two
# surfaces saying the same thing.
CGO_ENABLED = "0"
GOTOOLCHAIN = "local"

[tools]
"aqua:rustwasm/wasm-pack" = "0.15.0"
node = "24.19.0"
# Build input of the go-binary class (stele#7): cmd/lab-go, built on
# four native legs and repro-gated like every other class. Exact-pinned
# like every build input; the class asserts its presence, never installs.
go = "1.26.5"
# Two toolchains, both locked by mise. The stable pin is what everything
# builds and releases with; the dated nightly exists solely so audit:fuzz
# can run libFuzzer under AddressSanitizer on the cron, which the gate
# never touches. Components ride the pin so they install before any task
# runs — never mid-run rustup: coverage:check asserts llvm-tools,
# lint:rust asserts clippy and rustfmt.
rust = [
  { version = "1.97.1", components = "clippy,rustfmt,llvm-tools" },
  # rust-src is not optional on the nightly: audit:fuzz runs `--careful`,
  # which implies -Zbuild-std, which rebuilds the standard library from
  # source and fails without it. Components ride the pin here for the
  # same reason they do above — installed before any task runs.
  { version = "nightly-2026-07-20", components = "rust-src" },
]
# Build input of the pgrx-extension class; must match the pgrx crate dep.
"cargo:cargo-pgrx" = "0.19.2"
# Build input of the rust build classes: auditable binaries (.dep-v0).
"cargo:cargo-auditable" = "0.7.5"
# Build input of lint:fuzz-build / audit:fuzz (.github#316); cargo
# backend like cargo-pgrx, sanitizer-none on the stable pin.
"cargo:cargo-fuzz" = "0.13.2"

[tasks.test]
description = "The fixture crates and the Go module must build and pass — they are what the shared workflows execute against"
# Both languages, because the lab now ships artifacts from both: a test
# task that ran one of them would let the other's fixture rot until a
# release leg found it. -race is deliberately absent from the Go leg —
# it needs cgo on linux (stele#1) and CGO_ENABLED=0 above is the shape
# the go-binary class ships; the race detector belongs to a repo whose
# own code needs it, not to a fixture proving a release path.
run = ["cargo test --workspace --locked --exclude lab-pg", "go test ./..."]
