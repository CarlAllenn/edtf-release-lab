# Repo-specific tools and tasks only; the org belt arrives globally.
# ci is assembled by the toolbelt: define test/build/lint:* tasks here
# and they are collected automatically.

[settings]
lockfile = true

[tools]
"aqua:rustwasm/wasm-pack" = "0.15.0"
node = "24.19.0"
rust = "1.97.1"
# Build input of the pgrx-extension class; must match the pgrx crate dep.
"cargo:cargo-pgrx" = "0.19.2"

[tasks.test]
description = "The fixture crates must build and pass — they are what the shared workflows execute against"
run = "cargo test --workspace --locked --exclude lab-pg"
